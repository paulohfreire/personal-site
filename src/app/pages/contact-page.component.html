<section class="section contact-page" aria-labelledby="contact-page-title">
  <a class="text-link" routerLink="/">← Back to home</a>
  <div class="contact-page-grid">
    <div class="contact-page-intro">
      <p class="eyebrow">Contact · Let’s connect</p>
      <h1 id="contact-page-title">Good things start with <span>a conversation.</span></h1>
      <p>Have a project in mind, a question or an opportunity to share? Tell me a little about it.</p>
      <div class="contact-page-socials" aria-label="Social profiles">
        <a class="text-link" href="https://www.linkedin.com/in/phfreire/" target="_blank" rel="noopener noreferrer">LinkedIn ↗</a>
        <a class="text-link" href="https://www.instagram.com/paulofreireh/" target="_blank" rel="noopener noreferrer">Instagram ↗</a>
        <a class="text-link" href="https://github.com/paulohfreire/" target="_blank" rel="noopener noreferrer">GitHub ↗</a>
      </div>
    </div>
    <form class="contact-form" method="post" action="https://formspree.io/f/xrbgzkbn" aria-labelledby="form-title">
      <h2 id="form-title">Send a message</h2>
      <p class="form-note">All fields are required.</p>
      <div class="contact-fields">
        <div class="contact-field">
          <label for="name">Name</label>
          <input type="text" name="name" id="name" autocomplete="name" required />
        </div>
        <div class="contact-field">
          <label for="email">Email</label>
          <input type="email" name="email" id="email" autocomplete="email" spellcheck="false" required />
        </div>
        <div class="contact-field contact-field-message">
          <label for="message">Message</label>
          <textarea name="message" id="message" rows="6" required></textarea>
        </div>
      </div>
      <div class="contact-form-actions">
        <button type="submit" class="button button-primary">Send message <span aria-hidden="true">↗</span></button>
        <button type="reset" class="button button-ghost">Reset</button>
      </div>
    </form>
  </div>
</section>
