<article id="contact" class="active" (click)="$event.stopPropagation()">
  <h2 class="major">Contact</h2>
  <form method="post" action="https://formspree.io/f/xrbgzkbn">
    <div class="fields">
      <div class="field half">
        <label for="name">Name</label>
        <input type="text" name="name" id="name" required />
      </div>
      <div class="field half">
        <label for="email">Email</label>
        <input type="email" name="email" id="email" required />
      </div>
      <div class="field">
        <label for="message">Message</label>
        <textarea name="message" id="message" rows="4" required></textarea>
      </div>
    </div>
    <ul class="actions">
      <li><input type="submit" value="Send Message" class="primary" /></li>
      <li><input type="reset" value="Reset" /></li>
    </ul>
  </form>
  <ul class="icons">
    <li><a href="https://www.linkedin.com/in/phfreire/" target="_blank" rel="noopener noreferrer" class="icon brands fa-linkedin"><span
          class="label">Linkedin</span></a></li>
    <li><a href="https://www.instagram.com/paulofreireh/" target="_blank" rel="noopener noreferrer" class="icon brands fa-instagram"><span
          class="label">Instagram</span></a></li>
    <li><a href="https://github.com/paulohfreire/" target="_blank" rel="noopener noreferrer" class="icon brands fa-github"><span
          class="label">GitHub</span></a></li>
  </ul>
  <a routerLink="/" class="close">Close</a>
</article>
